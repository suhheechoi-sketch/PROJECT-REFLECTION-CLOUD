name: Web game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and web templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/engine
          cd work/engine
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fLO "$base/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fLO "$base/Godot_v4.7.2-stable_export_templates.tpz"
          curl -fLO "$base/SHA512-SUMS.txt"
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          unzip -q Godot_v4.7.2-stable_export_templates.tpz 'templates/web*' -d unpacked
          mkdir -p ../godot-data/godot/export_templates/4.7.2.stable
          cp unpacked/templates/web* ../godot-data/godot/export_templates/4.7.2.stable/
          echo "GODOT=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and regression tests
        run: bash VERIFY_REFLECTION.sh --import
      - name: Export single-threaded Compatibility web game
        run: |
          export XDG_DATA_HOME="$PWD/work/godot-data"
          mkdir -p work/web
          "$GODOT" --headless --path . --export-release Web work/web/index.html
          test -s work/web/index.wasm
          test -s work/web/index.pck
          touch work/web/.nojekyll
          cp assets/fonts/OFL.txt work/web/NotoSansKR-OFL.txt
          cp licenses/GODOT-LICENSE.txt work/web/GODOT-LICENSE.txt
      - name: Browser boot and touch smoke
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python tests/web_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: work/validation
      - uses: actions/upload-artifact@v4
        with:
          name: reflection-web
          path: work/web
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: work/web
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
